name: nix
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # x86_64-linux packages and checks build on nixbot. aarch64-linux builds
  # natively on GitHub's arm runners and is pushed to the niks3 cache.
  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-aarch64.yaml@main
    with:
      pin-prefix: gh-tagesschau-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
