name: Android build

on:
  push:
    paths: &paths
      - "android/**"
      - ".github/workflows/android-build.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  build:
    uses: pschmitt/ci-workflows/.github/workflows/build.yaml@main
    with:
      project-directory: android
      # A single universal app-debug.apk, no per-ABI splits.
      upload-artifacts: false
